<!DOCTYPE html>
<html>
<head>
    <title>ASCII Art Generator</title>
    <link rel="stylesheet" type="text/css" href="web.css">
</head>
<body>
    <h1>ASCII Art Generator</h1>
    <form action="/ascii-art" method="post">
        <textarea name="text" rows="5" cols="50" placeholder="Enter your text"></textarea>
        <br>
        <input type="radio" name="bannerType" value="standard" checked> Standard
        <input type="radio" name="bannerType" value="thinkertoy"> Thinkertoy
        <input type="radio" name="bannerType" value="shadow"> Shadow
        <br>
        <input type="submit" value="Generate ASCII Art">
    </form>
    <br>
    <div id="result">
        {{ if .ASCIIArt }}
            <pre>{{ .ASCIIArt }}</pre>
        {{ end }}
    </div>
</body>
</html>
