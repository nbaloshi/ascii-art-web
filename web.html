<!DOCTYPE html>
<html>
<head>
    <title>Input and Output Example</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 400px;
            padding: 20px;
            background-color: lightgray;
            border: 1px solid darkgray;
            border-radius: 5px;
        }
        
        .input-box {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
        }
        
        .output {
            width: 100%;
            padding: 10px;
            background-color: white;
            border: 1px solid darkgray;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Input and Output Example</h1>
        <input type="text" class="input-box" placeholder="Type something...">
        <div class="output" id="output"></div>
    </div>

    <script>
        const inputBox = document.querySelector('.input-box');
        const outputDiv = document.querySelector('#output');

        inputBox.addEventListener('input', () => {
            const inputValue = inputBox.value;
            outputDiv.textContent = inputValue;
        });
    </script>
</body>
</html>
